---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    fastly.amazee.io/watch: "false"
    idling.amazee.io/disable-request-verification: "false"
    ingress.kubernetes.io/ssl-redirect: "true"
    kubernetes.io/tls-acme: "true"
    lagoon.sh/branch: twootherroutes
    lagoon.sh/version: v2.7.x
    monitor.stakater.com/enabled: "false"
    monitor.stakater.com/overridePath: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  labels:
    activestandby.lagoon.sh/migrate: "false"
    app.kubernetes.io/instance: example2.com
    app.kubernetes.io/managed-by: build-deploy-tool
    app.kubernetes.io/name: custom-ingress
    lagoon.sh/autogenerated: "false"
    lagoon.sh/buildType: branch
    lagoon.sh/environment: twootherroutes
    lagoon.sh/environmentType: production
    lagoon.sh/project: example-project
    lagoon.sh/service: example2.com
    lagoon.sh/service-type: custom-ingress
    lagoon.sh/template: custom-ingress-0.1.0
    route.lagoon.sh/source: yaml
  name: example2.com
spec:
  rules:
  - host: example2.com
    http:
      paths:
      - backend:
          service:
            name: node
            port:
              name: http
        path: /
        pathType: Prefix
  - host: en.example2.com
    http:
      paths:
      - backend:
          service:
            name: node
            port:
              name: http
        path: /
        pathType: Prefix
  - host: www.example2.com
    http:
      paths:
      - backend:
          service:
            name: node
            port:
              name: http
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - example2.com
    - en.example2.com
    - www.example2.com
    secretName: example2.com-tls
status:
  loadBalancer: {}
